name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes in Markdown, shown above the generated list of changes
        type: string
        required: false

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - run: for mc in 1.21.11 26.1 26.1.1 26.1.2 26.2 26.3; do ./gradlew --no-daemon -Pminecraft_version=$mc assemble; done
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: ${{ inputs.notes }}
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          jars=$(ls build/*/libs/conflux-hud-*.jar | grep -v -- '-sources\.jar$')
          gh release create "v$version" $jars --target "$GITHUB_SHA" --title "Conflux HUD $version" --notes "$NOTES" --generate-notes
