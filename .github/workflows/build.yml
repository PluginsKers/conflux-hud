name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["1.21.11", "26.1", "26.1.1", "26.1.2", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - run: ./gradlew --no-daemon -Pminecraft_version=${{ matrix.minecraft }} assemble
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: conflux-hud-mc${{ matrix.minecraft }}
          path: |
            build/${{ matrix.minecraft }}/libs/*.jar
            !build/${{ matrix.minecraft }}/libs/*-sources.jar
          if-no-files-found: error
